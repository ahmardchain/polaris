[package]
name = "polaris-guarantee"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Capped NEAR pool that refunds an agent unless a trusted checker proves cross-chain delivery before the deadline."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

# `unit-testing` is pulled in for `cargo test` only. A release wasm build
# does not enable dev-dependency features.
[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
